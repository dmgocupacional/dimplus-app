name: Publicar nas lojas

# 23/09/2026. Um disparo leva a versão do app.json até as lojas:
#   1. capturas de tela novas, fotografadas do app real (scripts/capturas_lojas.py)
#   2. build de produção no EAS com envio automático do binário (--auto-submit)
#   3. textos + capturas nas lojas pelo fastlane (fonte única: fastlane/metadata e /screenshots)
#   4. iOS: espera a Apple processar o build e envia para revisão
#
# Antes de disparar: a versão no app.json (+ package.json + src/lib/version.ts) tem de ser a NOVA.
# O EAS incrementa o número do build sozinho (autoIncrement no eas.json).
#
# Lançamento AUTOMÁTICO depois da aprovação, nas duas lojas (decisão do Henrique, 23/09/2026).
# 02/10/2026: Android promove sozinho para produção (publicação gerenciada desligada na Play) e o
# iOS tenta de novo o envio para revisão pela API se a Apple ainda estiver processando o build.
# 🔴 Android só roda com o segredo GOOGLE_SA_JSON cadastrado — sem ele o job pula e avisa.
#
# Segredos usados: EXPO_TOKEN, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, DEMO_CPF, DEMO_SENHA,
# GOOGLE_SA_JSON (opcional até existir a conta de serviço).

on:
  workflow_dispatch:
    inputs:
      plataforma:
        description: Onde publicar
        type: choice
        options: [ios, android, ambas]
        default: ambas
      etapa:
        description: tudo = build + envio + textos; so-textos = só textos e capturas, sem build
        type: choice
        options: [tudo, so-textos]
        default: tudo
      ficha_android:
        description: "Android: atualizar também a ficha pública da Play Store (textos e capturas). Deixe DESLIGADO no teste interno — a ficha é vista por todos os usuários."
        type: boolean
        default: false
      promover_producao:
        description: "Android: depois do teste interno, promover direto para produção (lançamento completo)"
        type: boolean
        default: true
      version_code:
        description: "Android: versionCode do release em produção para a ficha (ex. 10013). Vazio = o build desta rodada"
        type: string
        default: ""
      enviar_revisao:
        description: iOS — enviar para revisão da Apple ao final
        type: boolean
        default: true

concurrency:
  group: publicar-lojas
  cancel-in-progress: false # nunca derrubar um envio no meio

jobs:
  capturas:
    name: Capturas de tela
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Fotografar o app
        env:
          DEMO_CPF: ${{ secrets.DEMO_CPF }}
          DEMO_SENHA: ${{ secrets.DEMO_SENHA }}
        run: python scripts/capturas_lojas.py
      - uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: |
            fastlane/screenshots
            fastlane/metadata/android/pt-BR/images
          retention-days: 7

  ios:
    name: iOS
    needs: capturas
    if: inputs.plataforma != 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build e envio do binário (EAS)
        if: inputs.etapa == 'tudo'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform ios --profile production --non-interactive --wait --auto-submit
      - uses: actions/download-artifact@v4
        with:
          name: capturas
          path: fastlane
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install fastlane --no-document
      - name: Textos, capturas e revisão (fastlane)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DEMO_CPF: ${{ secrets.DEMO_CPF }}
          DEMO_SENHA: ${{ secrets.DEMO_SENHA }}
          # Só-textos nunca envia para revisão: sem build novo, não há o que revisar.
          ENVIAR: ${{ inputs.etapa == 'tudo' && inputs.enviar_revisao }}
        run: fastlane ios publicar enviar_revisao:$ENVIAR
      - name: Revisão Apple — nova tentativa pela API se o fastlane falhou
        # 02/10/2026 — a Apple recusa ("not in valid state") enquanto ainda processa o build.
        if: failure() && inputs.enviar_revisao
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ENVIAR: sim
        run: |
          pip install pyjwt cryptography requests
          VERSAO=$(node -p "require('./app.json').expo.version"); export VERSAO
          for i in 1 2 3 4 5 6; do sleep 300; python scripts/diagnostico_apple.py | tee saida.txt; grep -q '"WAITING_FOR_REVIEW"' saida.txt && exit 0; done
          exit 1

  android:
    name: Android
    needs: capturas
    if: inputs.plataforma != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Conta de serviço do Google configurada?
        id: google
        env:
          SA: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::GOOGLE_SA_JSON não cadastrado — Android pulado. Cadastre a conta de serviço do Google Play."
            echo "pronto=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.google.outputs.pronto == 'true'
      - uses: actions/setup-node@v4
        if: steps.google.outputs.pronto == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.google.outputs.pronto == 'true'
      - name: Chave do Google para o EAS
        if: steps.google.outputs.pronto == 'true'
        env:
          SA: ${{ secrets.GOOGLE_SA_JSON }}
        run: printf '%s' "$SA" > google-sa.json
      - name: Build e envio do .aab (EAS)
        if: steps.google.outputs.pronto == 'true' && inputs.etapa == 'tudo'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile production --non-interactive --wait --auto-submit
      - name: versionCode do build desta rodada
        id: vc
        if: steps.google.outputs.pronto == 'true' && inputs.etapa == 'tudo'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          VC=$(npx eas-cli@latest build:list --platform android --build-profile production --status finished --limit 1 --json --non-interactive | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d)[0].appBuildVersion))")
          echo "versionCode: $VC"; echo "codigo=$VC" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.google.outputs.pronto == 'true'
        with:
          name: capturas
          path: fastlane
      - uses: ruby/setup-ruby@v1
        if: steps.google.outputs.pronto == 'true'
        with:
          ruby-version: "3.3"
      - run: gem install fastlane --no-document
        if: steps.google.outputs.pronto == 'true'
      - name: Textos e capturas da ficha (fastlane)
        # 28/09/2026 — a ficha é PÚBLICA: no teste interno ela não sobe (ficha_android = false).
        if: steps.google.outputs.pronto == 'true' && (inputs.ficha_android || inputs.etapa == 'so-textos')
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          VERSION_CODE: ${{ inputs.version_code || steps.vc.outputs.codigo }}
        run: fastlane android publicar
      - name: Promover teste interno → produção (fastlane)
        # 02/10/2026 — o envio do EAS cai no teste interno; aqui ele vai direto para produção.
        # O envio do .aab termina depois do build: tenta por até ~20 min até o release aparecer.
        if: steps.google.outputs.pronto == 'true' && inputs.etapa == 'tudo' && inputs.promover_producao
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          VERSION_CODE: ${{ steps.vc.outputs.codigo }}
        run: |
          for i in $(seq 1 20); do
            fastlane android promover && exit 0
            echo "release $VERSION_CODE ainda não está no teste interno — nova tentativa em 60s ($i/20)"; sleep 60
          done
          exit 1
