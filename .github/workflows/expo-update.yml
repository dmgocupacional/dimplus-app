name: Publicar no Expo Go

# Todo push na main republica o app. O Henrique abre o Expo Go no celular e o
# update novo já está lá — sem máquina local, sem build de 15 minutos.
#
# Runtime: exposdk:57.0.0 (definido por runtimeVersion.policy = "sdkVersion" no
# app.json, resolvido a partir da versão do pacote `expo` em package.json).
# Era exposdk:54.0.0 até 04/09/2026, quando o app subiu para o SDK 57 — o Expo Go
# da App Store só carrega o SDK corrente, e no 54 o projeto tinha sumido da aba
# Projects do celular.
#
# ⚠️ ESTE COMENTÁRIO JÁ ESTEVE ERRADO ANTES. Até 17/08/2026 dizia "exposdk:57.0.0"
# quando o runtime real era 54, e isso
# custou um diagnóstico inteiro: o celular apareceu rodando um bundle de julho, e a
# hipótese de incompatibilidade de runtime pareceu plausível POR CAUSA DESTE COMENTÁRIO.
# (Naquela ocasião, `eas branch:list` mostrou todos os updates em exposdk:54.0.0,
# coerentes entre si — a causa real era CACHE do Expo Go, matar e reabrir resolve.)
# Se conferir de novo: `export EXPO_TOKEN=... && npx eas-cli@latest branch:list`.
#
# Se um dia alguém trocar a policy para "appVersion", o Expo Go PARA de abrir o projeto —
# e o erro será silencioso. Não troque sem entender isso.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    # `issues: write` é obrigatório para o alerta de falha abrir issue. Sem isto o
    # GITHUB_TOKEN vem somente-leitura em muitas configurações e o passo de alerta falha —
    # um alerta que falha em silêncio seria pior que não ter alerta nenhum.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Instalar EAS CLI
        run: npm install -g eas-cli@latest

      - name: Publicar update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_SKIP_AUTO_FINGERPRINT: '1'
        run: |
          eas update \
            --branch preview \
            --environment preview \
            --message "${{ github.event.head_commit.message || 'manual' }}" \
            --non-interactive

      # ═══ ALERTA DE FALHA ═══
      # 14/09/2026 — nasce de um dia inteiro perdido. Este workflow falhou CALADO três vezes
      # (51d2a6b, ffc1b91, f73e3b1, 09e763e): o commit ia para a main, a versão bumpava, e o
      # bundle NÃO. O Henrique seguiu testando no celular um bundle mais velho que o repo,
      # achando que estava olhando o código atual — e o diagnóstico do que parecia bug de tela
      # custou horas até alguém pensar em conferir se a publicação tinha saído.
      #
      # A notificação padrão do GitHub por e-mail existe, mas se perde na caixa. Uma ISSUE é
      # visível no repo, não depende de e-mail, e não precisa de secret nenhum: o GITHUB_TOKEN
      # já vem no runner. Menos peças para quebrar em silêncio — que é o ponto.
      - name: Abrir issue se a publicação falhar
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.slice(0, 7)
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 EAS Update falhou em ${sha}`,
              body: [
                `A publicação do commit \`${sha}\` **não saiu**.`,
                ``,
                `⚠️ O bundle no celular continua o da publicação bem-sucedida ANTERIOR.`,
                `Qualquer teste feito no app agora está rodando código velho — não confie`,
                `no que a tela mostrar até isto ser resolvido.`,
                ``,
                `Log: ${url}`,
              ].join('\n'),
            })
