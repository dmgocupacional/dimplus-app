# Envio de um build já pronto para a loja (App Store ou Google Play).
#
# Existe porque o envio direto pelo conector do Expo é recusado com
# "conflict between exclusive peers [appleAppSpecificPassword, ascApiKey, ascApiKeyId]"
# mesmo sem senha de app cadastrada — o problema é do pedido montado pelo conector.
# Rodando como workflow, o envio usa a chave de API da App Store Connect guardada no
# EAS e o perfil `production` do eas.json, exatamente como o `eas submit` do terminal.
#
# Disparo: pelo conector (workflow_run) ou `eas workflow:run enviar-loja.yml`, informando
# o build_id. A plataforma vem do próprio build.
name: Enviar build para a loja
run_name: Enviar ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        type: string
        required: true
        description: ID do build do EAS (perfil production)

jobs:
  enviar:
    name: Enviar para a loja
    type: submit
    params:
      build_id: ${{ inputs.build_id }}
      profile: production
